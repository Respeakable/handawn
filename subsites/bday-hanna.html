<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="bday-hanna-style.css" />
    <title>💚 | Happy Birthday, Hanna!</title>
  </head>
  <body>
    <h1>
      OOPS !! <br />
      Open on ur bday :p
    </h1>
    <div class="container">
      <h1>Countdown 'til ur bday :p</h1>
      <div class="timer">
        <div class="timer-unit">
          <span class="timer-value" id="days">0</span>
          <div class="timer-label">Days</div>
        </div>
        <div class="timer-unit">
          <span class="timer-value" id="hours">0</span>
          <div class="timer-label">Hours</div>
        </div>
        <div class="timer-unit">
          <span class="timer-value" id="minutes">0</span>
          <div class="timer-label">Minutes</div>
        </div>
        <div class="timer-unit">
          <span class="timer-value" id="seconds">0</span>
          <div class="timer-label">Seconds</div>
        </div>
      </div>
      <div class="message">
        <p>Set 'til' <strong>June 11, 2026</strong></p>
      </div>
    </div>

    <script>
      const targetDate = new Date("2026-06-11T00:00:00").getTime();

      function updateTimer() {
        const now = new Date().getTime();
        const difference = targetDate - now;

        if (difference < 0) {
          document.querySelector(".container").innerHTML =
            '<h1 class="expired">🎉 HAPPYYY ! BIRTHDAY HANNAAAA !! 🎉</h1>';
          return;
        }

        const days = Math.floor(difference / (1000 * 60 * 60 * 24));
        const hours = Math.floor(
          (difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60),
        );
        const minutes = Math.floor(
          (difference % (1000 * 60 * 60)) / (1000 * 60),
        );
        const seconds = Math.floor((difference % (1000 * 60)) / 1000);

        document.getElementById("days").textContent = String(days).padStart(
          2,
          "0",
        );
        document.getElementById("hours").textContent = String(hours).padStart(
          2,
          "0",
        );
        document.getElementById("minutes").textContent = String(
          minutes,
        ).padStart(2, "0");
        document.getElementById("seconds").textContent = String(
          seconds,
        ).padStart(2, "0");
      }

      // Update immediately on load
      updateTimer();

      // Update every second
      setInterval(updateTimer, 1000);
    </script>
  </body>
</html>
